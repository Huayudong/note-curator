name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 刻意不设置 PYTHONUTF8 / PYTHONIOENCODING：
      # Windows 默认编码环境下脚本必须自我声明 UTF-8（B01-02 / G16）。
      - name: 风格语言包回归
        run: python tests/run_style_tests.py
      - name: 写入事务回归（B01）
        run: python tests/run_write_tests.py
      - name: 插件契约测试（B09）
        run: python tests/run_plugin_contract.py
      - name: 评测纪律测试（B10）
        run: python tests/run_b10_tests.py
      - name: 稳定性测试（B11）
        run: python tests/run_b11_tests.py
